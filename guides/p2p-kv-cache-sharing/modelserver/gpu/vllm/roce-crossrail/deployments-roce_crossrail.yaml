---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2p-kv-cache-sharing-decode-0
  namespace: llm-d-p2p-kv-cache-sharing
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
    llm-d.ai/guide: p2p-kv-cache-sharing
    llm-d.ai/model: gpt-oss-120b
    llm-d.ai/role: decode
    llm-d.ai/rdma-rail: "0"
spec:
  replicas: 8
  selector:
    matchLabels:
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
      llm-d.ai/engine-type: vllm
      llm-d.ai/guide: p2p-kv-cache-sharing
      llm-d.ai/model: gpt-oss-120b
      llm-d.ai/role: decode
      llm-d.ai/rdma-rail: "0"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/engine-type: vllm
        llm-d.ai/guide: p2p-kv-cache-sharing
        llm-d.ai/model: gpt-oss-120b
        llm-d.ai/role: decode
        llm-d.ai/rdma-rail: "0"
      annotations:
        networking.gke.io/default-interface: "eth0"
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth2","network":"rdma-0"}
          ]
    spec:
      serviceAccountName: p2p-kv-cache-sharing-sa
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:main
          imagePullPolicy: Always
          restartPolicy: Always
          args:
            - --port=8000
            - --vllm-port=8200
            - --kv-connector=offloading
            - --p2p-connector-port=7777
            - --secure-proxy=false
          ports:
            - containerPort: 8000
              name: sidecar
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      containers:
        - name: modelserver
          image: vllm/vllm-openai:v0.27.1
          command:
            - "sh"
            - "-c"
            - "apt-get update -qq && apt-get install -y -qq librdmacm1 2>/dev/null; rm -f /dev/shm/vllm_offload_*.mmap 2>/dev/null; exec vllm serve \"$@\""
            - "sh"
          args:
            - /model-cache/openai/gpt-oss-120b
            - --served-model-name=openai/gpt-oss-120b
            - --port=8200
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            - --tensor-parallel-size=1
            - --block-size=64
            - --max-model-len=65536
            - --gpu-memory-utilization=0.85
            - --kv-transfer-config
            - '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":94489280512,"offload_prompt_only":false,"secondary_tiers":[{"type":"p2p","host":"$(POD_IP)","port":7777}]}}'
            - --kv-events-config
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@openai/gpt-oss-120b"}'
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 7777
              name: p2p
              protocol: TCP
            - containerPort: 5556
              name: kv-events
              protocol: TCP
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: UCX_IB_ROCE_LOCAL_SUBNET
              value: "n"
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
            - name: UCX_IB_GPU_DIRECT_RDMA
              value: "y"
            - name: UCX_IB_GDA_DMABUF_ENABLE
              value: "y"
            - name: UCX_TLS
              value: "rc_mlx5,rc,cuda_copy,cuda_ipc,sm,shm,self"
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1,eth0"
            - name: UCX_IB_GID_INDEX
              value: "3"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_P2P_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PYTHONHASHSEED
              value: "0"
            - name: KV_EVENTS_ENDPOINT
              value: "tcp://*:5556"
            - name: POD_PORT
              value: "8000"
            - name: DO_NOT_TRACK
              value: "1"
          resources:
            limits:
              cpu: "8"
              memory: 160Gi
              nvidia.com/gpu: "1"
              networking.gke.io.networks/rdma-0: "0"
            requests:
              cpu: "8"
              memory: 160Gi
              nvidia.com/gpu: "1"
              networking.gke.io.networks/rdma-0: "0"
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /dev/infiniband
              name: dev-infiniband
            - mountPath: /model-cache
              name: host-model-cache
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 96Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: dev-infiniband
          hostPath:
            path: /dev/infiniband
        - name: host-model-cache
          hostPath:
            path: /mnt/stateful_partition/model-cache
            type: DirectoryOrCreate
---
